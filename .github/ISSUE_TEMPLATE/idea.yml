name: Ý tưởng
description: Ý tưởng chưa chín, cần bàn trước khi thành tính năng.
title: "[Ý tưởng] "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Ý tưởng
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Vì sao đáng làm
      description: Lợi gì cho kênh hoặc cho đội.
