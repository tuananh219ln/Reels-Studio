name: CI/CD

# Every PR and push to main runs the checks. A push to main then deploys, only after every check
# passes: the api + postgres stack on Coolify first (it runs the migrations), then the web app on
# Cloudflare, so the new web never talks to an old API. Setup steps are in the README.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - run: pip install -e ".[dev]"
      # -rs lists every skipped test: a skip here means Postgres was not reachable.
      - run: python -m pytest -q -rs
      - name: Build production image
        run: docker build -t reels-api:ci .

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      # FFmpeg is required here so the render smoke tests run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -rs

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Playwright starts the api from api/.venv (see web/playwright.config.ts).
      - name: Install api for E2E
        working-directory: api
        run: python -m venv .venv && .venv/bin/pip install -e .
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
      - name: Cloudflare build
        working-directory: web
        env:
          API_URL: https://api.invalid
        run: npx opennextjs-cloudflare build

  deploy-api:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [api, worker, web]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The webhook only queues a build on the server; follow that deployment until Coolify reports
      # it finished, so a failed build or migration stops the web deploy.
      - name: Deploy on Coolify and wait
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          response=$(curl --fail-with-body --silent --show-error --request POST "$COOLIFY_WEBHOOK" --header "$auth")
          echo "$response"
          deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
          api_base="${COOLIFY_WEBHOOK%%/deploy*}"
          for i in $(seq 1 90); do
            status=$(curl --fail --silent --show-error "$api_base/deployments/$deployment" --header "$auth" | jq -r '.status')
            echo "attempt $i: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) echo "Coolify deployment $deployment: $status (see its logs in Coolify)" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Coolify deployment $deployment did not finish within 15 minutes" >&2; exit 1

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and deploy to Cloudflare
        env:
          API_URL: ${{ vars.API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
