name: CI/CD

# Every PR and push to main runs the checks. A push to main then deploys, only after every check
# passes: the api on Coolify first (it runs the migrations), then the worker on Coolify, then the web
# app on Cloudflare, so the new web never talks to an old API. Setup steps are in the README.
# A draft PR runs the quick checks only (lint, typecheck, pytest); E2E and the image builds run once
# it is marked ready for review. A PR that changes only docs runs nothing.
# Nothing already tested runs twice (the "passed" job): marking a PR ready reruns the quick checks only
# if they did not pass on that commit (the "api-passed" job then reports the api shards under their
# required names), and a push to main deploys without testing again when the code
# is exactly the merged PR's last commit and every check passed there (main requires PRs to be up to
# date, so a merge, squash or rebase leaves the same files). Any other push to main runs every check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which checks already passed on this exact code. Outputs "quick" (api, worker, web) when a PR is
  # marked ready, "all" (every check) on a push to main. On any doubt or error the checks run.
  passed:
    if: github.event.action == 'ready_for_review' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      pull-requests: read
      contents: read
    outputs:
      quick: ${{ steps.check.outputs.quick }}
      all: ${{ steps.check.outputs.all }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          quick='["api (1)","api (2)","api (3)","api (4)","worker","web"]'
          all='["api (1)","api (2)","api (3)","api (4)","worker","web","api-image","e2e (1)","e2e (2)","e2e (3)","e2e (4)"]'
          # The latest run of each named check on a commit; true when every wanted one succeeded.
          passed() {
            gh api --paginate "repos/$REPO/commits/$1/check-runs?per_page=100" \
              -q '.check_runs[] | select(.app.slug == "github-actions") | {id, name, conclusion}' |
              jq -s --argjson want "$2" \
                '(group_by(.name) | map(max_by(.id)) | map(select(.conclusion == "success") | .name)) as $ok
                 | all($want[]; . as $n | $ok | index($n) != null)'
          }
          tree() { gh api "repos/$REPO/commits/$1" -q .commit.tree.sha; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "quick=$(passed "$PR_HEAD" "$quick")" | tee -a "$GITHUB_OUTPUT"
          else
            head=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
              -q '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // empty')
            echo "Merged PR's last commit: ${head:-none}"
            if [ -n "$head" ] && [ "$(tree "$GITHUB_SHA")" = "$(tree "$head")" ]; then
              echo "all=$(passed "$head" "$all")" | tee -a "$GITHUB_OUTPUT"
            else
              echo "all=false" | tee -a "$GITHUB_OUTPUT"
            fi
          fi

  # api pytest on four machines at once, each running every 4th test (PYTEST_SHARD, tests/conftest.py).
  # Every job has a timeout: without one a hung step bills up to six hours.
  api:
    needs: passed
    if: ${{ !cancelled() && needs.passed.outputs.quick != 'true' && needs.passed.outputs.all != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_test
      PYTEST_SHARD: ${{ matrix.shard }}/4
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            worker/pyproject.toml
      # FFmpeg: the worker tests and the render parity test need it instead of being skipped.
      - uses: ./.github/actions/setup-ffmpeg
      - run: pip install -e ../worker -e ".[dev]"
      # Lint and format rules live in the repo-root ruff.toml, shared with the worker.
      - run: ruff check . && ruff format --check .
      # A skip here means Postgres or FFmpeg was not there, so it fails the job instead of hiding the
      # integration, worker and render parity tests.
      # pipefail: without it the pipe reports tee's status and failing tests would pass the step.
      - run: set -o pipefail; python -m pytest -q -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log

  # When a PR is marked ready and the api shards already passed on this commit, the api job above is
  # skipped, and a skipped matrix job reports one "api" check instead of "api (1)"…"api (4)". The
  # "Protect main" ruleset requires those four names, so the PR would wait forever. This job reports
  # them under the same names, and passes only because the "passed" job found every quick check
  # (each api shard included) green on this exact commit. It runs no tests, so the saving stays.
  api-passed:
    needs: passed
    if: ${{ !cancelled() && needs.passed.outputs.quick == 'true' }}
    name: api (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - run: echo "api shard ${{ matrix.shard }}/4 already passed on ${{ github.event.pull_request.head.sha }}"

  # The production images and the render parity test inside the worker image, beside the api tests.
  api-image:
    needs: passed
    if: >-
      ${{ !cancelled() && needs.passed.outputs.all != 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_test
    steps:
      - uses: actions/checkout@v4
      # Both images build from the repo root (the api and the worker install ../worker too).
      - name: Build production images
        run: |
          docker build -t reels-api:ci -f api/Dockerfile .
          docker build -t reels-worker:ci -f api/Dockerfile.worker .
      - name: Render parity test inside the worker image (its own FFmpeg)
        run: |
          docker run --rm --network host --user root -v "$PWD:/src" -w /src/api \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" -e PYTHONDONTWRITEBYTECODE=1 reels-worker:ci \
            bash -o pipefail -c "ffmpeg -version | head -1 && pip install -q pytest httpx psutil &&
              python -m pytest -q -rs -p no:cacheprovider tests/test_render_parity.py | tee /tmp/parity.log &&
              ! grep -q SKIPPED /tmp/parity.log"

  worker:
    needs: passed
    if: ${{ !cancelled() && needs.passed.outputs.quick != 'true' && needs.passed.outputs.all != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      # FFmpeg is required here so the render smoke tests run instead of being skipped.
      - uses: ./.github/actions/setup-ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q -rs

  web:
    needs: passed
    if: ${{ !cancelled() && needs.passed.outputs.quick != 'true' && needs.passed.outputs.all != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint && npm run format:check
      - name: Cloudflare build
        env:
          API_URL: https://api.invalid
        run: npx opennextjs-cloudflare build

  # E2E on four machines at once, each with its own Postgres, api, worker and web build.
  e2e:
    needs: passed
    if: >-
      ${{ !cancelled() && needs.passed.outputs.all != 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            worker/pyproject.toml
      # E2E runs a real worker, which renders with FFmpeg.
      - uses: ./.github/actions/setup-ffmpeg
      # Playwright starts the api, the worker and the fake Claude/Pixabay from api/.venv (see web/playwright.config.ts).
      - name: Install api for E2E
        working-directory: api
        run: python -m venv .venv && .venv/bin/pip install -e ../worker -e .
      - working-directory: web
        run: npm ci
      # The browsers are cached per Playwright version (package-lock). Its system libraries come from
      # the slow apt mirror, so they are installed only when the runner image lacks one of them.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/package-lock.json') }}
      - name: Chromium for Playwright
        working-directory: web
        run: |
          npx playwright install chromium
          missing=$(find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) \
            -exec ldd {} \; | grep "not found" || true)
          if [ -n "$missing" ]; then echo "$missing"; npx playwright install-deps chromium; fi
      # Every 4th test, not --shard: that splits in file order and puts all the render-heavy videos.spec.ts tests
      # on the last two machines.
      - name: E2E (shard ${{ matrix.shard }}/4)
        working-directory: web
        run: |
          npx playwright test --list | grep '›' | awk -v n=4 -v i=${{ matrix.shard }} 'NR % n == i - 1' > e2e-shard.txt
          test -s e2e-shard.txt
          npm run e2e -- --test-list e2e-shard.txt

  deploy-api:
    # Deploys when every check passed in this run, or all of them passed on the merged PR's last commit.
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.passed.outputs.all == 'true' ||
      (needs.api.result == 'success' && needs.api-image.result == 'success' && needs.worker.result == 'success' &&
      needs.web.result == 'success' && needs.e2e.result == 'success')) }}
    needs: [passed, api, api-image, worker, web, e2e]
    runs-on: ubuntu-latest
    # Each of the two Coolify deployments is followed for up to 15 minutes.
    timeout-minutes: 35
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Each webhook only queues a build on the server; follow that deployment until Coolify reports
      # it finished, so a failed build or migration stops what comes after. The api goes first: it
      # runs the migrations the worker needs.
      - name: Deploy api and worker on Coolify and wait
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_WORKER_WEBHOOK: ${{ secrets.COOLIFY_WORKER_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          deploy() {
            response=$(curl --fail-with-body --silent --show-error --request POST "$1" --header "$auth")
            echo "$response"
            deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
            api_base="${1%%/deploy*}"
            for i in $(seq 1 90); do
              status=$(curl --fail --silent --show-error "$api_base/deployments/$deployment" --header "$auth" | jq -r '.status')
              echo "$2 attempt $i: $status"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled*) echo "Coolify deployment $deployment ($2): $status (see its logs in Coolify)" >&2; return 1 ;;
              esac
              sleep 10
            done
            echo "Coolify deployment $deployment ($2) did not finish within 15 minutes" >&2; return 1
          }
          deploy "$COOLIFY_WEBHOOK" api
          deploy "$COOLIFY_WORKER_WEBHOOK" worker

  deploy-web:
    needs: deploy-api
    # The default success() also looks at deploy-api's own needs, which are skipped when the checks
    # already passed on the merged PR; that silently skipped this job. Follow deploy-api alone.
    if: ${{ !cancelled() && needs.deploy-api.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and deploy to Cloudflare
        env:
          API_URL: ${{ vars.API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
