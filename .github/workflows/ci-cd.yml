name: CI/CD

# Every PR and push to main runs the checks. A push to main then deploys, only after every check
# passes: the api on Coolify first (it runs the migrations), then the worker on Coolify, then the web
# app on Cloudflare, so the new web never talks to an old API. Setup steps are in the README.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            worker/pyproject.toml
      # FFmpeg: the worker tests and the render parity test need it instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ../worker -e ".[dev]"
      # Lint and format rules live in the repo-root ruff.toml, shared with the worker.
      - run: ruff check . && ruff format --check .
      # A skip here means Postgres or FFmpeg was not there, so it fails the job instead of hiding the
      # integration, worker and render parity tests.
      # pipefail: without it the pipe reports tee's status and failing tests would pass the step.
      - run: set -o pipefail; python -m pytest -q -rs | tee pytest.log && ! grep -q "SKIPPED" pytest.log
      # Both images build from the repo root (the api and the worker install ../worker too).
      - name: Build production images
        working-directory: .
        run: |
          docker build -t reels-api:ci -f api/Dockerfile .
          docker build -t reels-worker:ci -f api/Dockerfile.worker .
      - name: Render parity test inside the worker image (its own FFmpeg)
        working-directory: .
        run: |
          docker run --rm --network host --user root -v "$PWD:/src" -w /src/api \
            -e TEST_DATABASE_URL="$TEST_DATABASE_URL" -e PYTHONDONTWRITEBYTECODE=1 reels-worker:ci \
            bash -o pipefail -c "ffmpeg -version | head -1 && pip install -q pytest httpx psutil &&
              python -m pytest -q -rs -p no:cacheprovider tests/test_render_parity.py | tee /tmp/parity.log &&
              ! grep -q SKIPPED /tmp/parity.log"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      # FFmpeg is required here so the render smoke tests run instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q -rs

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reels
          POSTGRES_PASSWORD: reels
          POSTGRES_DB: reels_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reels -d reels_e2e" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgresql+psycopg://reels:reels@127.0.0.1:5432/reels_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # E2E runs a real worker, which renders with FFmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Playwright starts the api, the worker and the fake Claude/Pixabay from api/.venv (see web/playwright.config.ts).
      - name: Install api for E2E
        working-directory: api
        run: python -m venv .venv && .venv/bin/pip install -e ../worker -e .
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run lint && npm run format:check
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run e2e
      - name: Cloudflare build
        working-directory: web
        env:
          API_URL: https://api.invalid
        run: npx opennextjs-cloudflare build

  deploy-api:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [api, worker, web]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Each webhook only queues a build on the server; follow that deployment until Coolify reports
      # it finished, so a failed build or migration stops what comes after. The api goes first: it
      # runs the migrations the worker needs.
      - name: Deploy api and worker on Coolify and wait
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_WORKER_WEBHOOK: ${{ secrets.COOLIFY_WORKER_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          auth="Authorization: Bearer $COOLIFY_TOKEN"
          deploy() {
            response=$(curl --fail-with-body --silent --show-error --request POST "$1" --header "$auth")
            echo "$response"
            deployment=$(echo "$response" | jq -r '.deployments[0].deployment_uuid')
            api_base="${1%%/deploy*}"
            for i in $(seq 1 90); do
              status=$(curl --fail --silent --show-error "$api_base/deployments/$deployment" --header "$auth" | jq -r '.status')
              echo "$2 attempt $i: $status"
              case "$status" in
                finished) return 0 ;;
                failed|cancelled*) echo "Coolify deployment $deployment ($2): $status (see its logs in Coolify)" >&2; return 1 ;;
              esac
              sleep 10
            done
            echo "Coolify deployment $deployment ($2) did not finish within 15 minutes" >&2; return 1
          }
          deploy "$COOLIFY_WEBHOOK" api
          deploy "$COOLIFY_WORKER_WEBHOOK" worker

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production-web
      cancel-in-progress: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and deploy to Cloudflare
        env:
          API_URL: ${{ vars.API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
