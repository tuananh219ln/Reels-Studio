name: CI rerun after GitHub incidents

# During a GitHub Actions incident a CI/CD run can end as "failure" without creating some or all of its
# jobs; the required checks it never created then stay "Waiting for status" and block the PR. Every
# 20 minutes this reruns such a run once, when none of its jobs actually failed (see the script).
# A run with a real failing test is never rerun. "Run workflow" on the Actions tab runs it at once.

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: ci-rerun
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Rerun CI/CD runs that GitHub broke
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/rerun-stalled-ci.sh
