[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-api"
version = "0.1.0"
description = "Reels Studio API and worker: login, users, videos, scenes, the job queue and its worker."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.20",
    "anthropic>=2.3",
    # llm.py calls the OpenAI-compatible and Gemini APIs with it; anthropic does not bring it in.
    "httpx>=0.27",
    "cryptography>=44",
    "mcp>=1.30,<2",
    # Public clip search/download; default extras bundle the YouTube JS solver instead of fetching it at runtime.
    "yt-dlp[default]>=2026.10.26",
    # The render core in ../worker: install it first (pip install ../worker), it is not on PyPI.
    "reels-render",
]

[project.optional-dependencies]
# "Sửa ảnh" › "Xóa vùng" on the worker (image_edit.py): only the worker image installs it, with the LaMa model.
inpaint = ["onnxruntime>=1.20"]
# onnx writes the tests' stand-in for the LaMa model (tests/tiny_lama.py).
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27", "psutil>=6", "ruff>=0.15", "onnxruntime>=1.20", "onnx>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reels_api = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
