  - asked_at: "2026-10-28"
    topic_keys: ["ui_ux_requirements", "edge_cases", "error_scenarios"]
    agent_questions: |
      1. Chốt kích thước và vị trí hộp chữ (khung 1080×1920)? Giao diện Reels/TikTok che khoảng 20% dưới cùng và ~10% trên cùng.
         - Bộ số đề xuất (Recommended): Hộp rộng tối đa 960px. Tiêu đề: cỡ 96px, thu nhỏ tối thiểu 64px, tối đa 5 dòng, giữa khung. Cảnh nội dung: cỡ 84px, tối thiểu 60px, tối đa 3 dòng, đáy hộp cách đáy khung 480px (nằm trên vùng bị che). Vượt thì báo lỗi nêu cảnh.
         - Chữ to hơn, ít dòng hơn: Tiêu đề 110px (tối thiểu 80px, ≤4 dòng); cảnh nội dung 96px (tối thiểu 72px, ≤2 dòng). Dễ đọc hơn cho người 50+, nhưng kịch bản dài sẽ bị báo lỗi nhiều hơn (tiêu đề template cho phép 3–5 dòng).
