  testing_strategy:
    score: 88
    value: |
      - Unit (pytest, không cần FFmpeg): validate JSON + lỗi nêu cảnh, parser *đỏ* (cả * lẻ), uppercase
        tiếng Việt + NFC, ngắt dòng/thu nhỏ chữ, timeline (offset xfade, tổng = sum seconds), builder
        filter graph (có/không nhạc).
      - Integration Pillow: PNG hộp chữ RGBA, nền trong suốt ngoài hộp, có pixel đỏ khi có markup, không vượt độ rộng.
      - Smoke render (cần FFmpeg, skip có lý do nếu không có): ảnh sinh bằng Pillow, 2–3 cảnh ngắn,
        ffprobe kiểm tra 1080×1920, 30fps, h264/yuv420p, thời lượng ±1 frame, có audio stream (cả khi không nhạc).
      - Smoke bổ sung (ffprobe theo từng stream, tone sinh bằng FFmpeg sine, đo mức bằng FFmpeg
        volumedetect/astats trên từng đoạn của audio output):
        nhạc ngắn hơn video (vd. tone 1s, video 3s) → đoạn sau mốc hết nhạc gốc (trước vùng fade) vẫn có
        tín hiệu, không im lặng (phân biệt lặp với đệm im lặng);
        nhạc dài hơn → audio stream bị cắt ≈ thời lượng video;
        âm lượng: mean volume đoạn giữa output ≈ tone gốc − 12 dB (±1.5 dB) với mặc định 0.25; --music-volume 0.5 → ≈ −6 dB;
        fade-out: 0.2s cuối nhỏ hơn đoạn giữa ít nhất 20 dB;
        không nhạc → audio stream có, im lặng, đủ dài.
      - --music-volume ngoài 0–1 → lỗi trước khi render.
      - Validation lỗi đầu vào (unit, không cần FFmpeg; mỗi case kiểm thông báo tiếng Việt nêu đúng
        "Cảnh tiêu đề"/"Cảnh N"/đường dẫn): JSON hỏng cú pháp; thiếu trường; không có cảnh nội dung;
        file ảnh không tồn tại; file ảnh hỏng (không mở được bằng Pillow); file nhạc không tồn tại;
        không tìm thấy ffmpeg/ffprobe (giả lập PATH rỗng / override đường dẫn) → thông báo hướng dẫn cài.
      - Dọn dẹp khi thành công (smoke): sau render không còn file tạm cạnh output và thư mục trung gian đã bị xóa.
      - File đích bị khóa (giả lập bằng monkeypatch os.replace ném PermissionError) → còn <tên>.new.mp4,
        file cũ nguyên vẹn, thông báo nêu đường dẫn bản mới, lỗi có kiểu / mã thoát ≠ 0.
      - Ảnh lệch tỉ lệ (ngang/vuông) dùng trong smoke → output vẫn 1080×1920.
      - EXIF: ảnh Pillow gắn EXIF orientation=6 → sau chuẩn hóa, ảnh trung gian có kích thước đã xoay
        (unit/integration ở bước chuẩn hóa ảnh, không cần FFmpeg).
      - Lỗi FFmpeg: ép FFmpeg lỗi (vd. file nhạc giả hỏng vượt qua kiểm tra tồn tại) khi đã có output cũ →
        output cũ còn nguyên nội dung, không còn file tạm, không còn file trung gian.
      - CLI (subprocess `python -m reels_render`): đầu vào thiếu ảnh → mã thoát ≠ 0, thông báo nêu cảnh,
        không tạo file; thư mục -o chưa có → được tạo; thành công → mã 0, file tồn tại.
      - Timeline: offset xfade đặt crossfade giữa ranh giới, tổng = tổng seconds đã làm tròn khung hình; seconds < 1 → lỗi.
      - Validation: text rỗng, dòng trống, ** rỗng, * lẻ → lỗi nêu cảnh.
      - Ngắt dòng/thu nhỏ: test ngưỡng — chữ vừa ở 84px; chữ phải thu nhỏ; chữ không vừa ở 60px / quá 3 dòng → lỗi; tiêu đề > 5 dòng → lỗi.
      - Kiểm tra hiệu năng: render xuong-khop (~24s) đo thời gian, mục tiêu theo tỉ lệ 30s ≤ 60s.
      - Thủ công: người dùng xem video xuong-khop so với template.
    gaps: []
    required: true

