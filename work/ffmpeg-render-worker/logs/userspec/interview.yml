  - asked_at: "2026-10-28"
    topic_keys: ["data_requirements", "edge_cases", "technical_decisions", "success_criteria", "technical_constraints"]
    agent_questions: |
      1. Template ghi 'tên món + một dòng lợi ích', nhưng mô hình dữ liệu chỉ có một trường text cho mỗi cảnh. Bạn muốn thế nào?
         - 1 trường, xuống dòng bằng \n (Recommended): "CÁ NHỎ ĂN CẢ XƯƠNG\nGiàu *canxi*, rẻ" — cả hai dòng cùng hộp vàng, cùng cỡ chữ. Khớp mô hình dữ liệu, đơn giản. Không có huy hiệu số thứ tự.
         - 2 trường: tên + lợi ích: Tên món trong hộp vàng cỡ lớn, dòng lợi ích cỡ nhỏ hơn bên dưới (như prototype cũ). Phải sửa mô hình dữ liệu trong tài liệu.
         - 2 trường + huy hiệu số: Như trên, thêm vòng tròn đỏ số thứ tự 1, 2, 3… như prototype.
      2. Crossfade làm các cảnh chồng lên nhau. Tổng thời lượng video tính sao?
         - Đúng bằng tổng seconds (Recommended): Mỗi cảnh tự kéo dài thêm phần chồng, nên 6 cảnh × 4s = video đúng 24s; mỗi cảnh vẫn hiện rõ đủ số giây ghi trong JSON.
         - Ngắn đi theo số lần chuyển: Video = tổng seconds trừ (số cảnh − 1) × thời gian crossfade. Đơn giản hơn chút nhưng số giây trong JSON không còn khớp.
      3. Về âm thanh: không có nhạc thì sao, và nhạc ngắn hơn video thì sao?
         - Track im lặng + lặp nhạc (Recommended): Không nhạc: vẫn có track âm thanh im lặng (một số nền tảng/trình phát xử lý tốt hơn, và TTS sau này sẽ mix vào). Nhạc ngắn: lặp lại cho đủ độ dài.
         - Không audio + lặp nhạc: Không nhạc: file không có track âm thanh. Nhạc ngắn: lặp lại.
         - Track im lặng + đệm im lặng: Nhạc ngắn: hết nhạc thì phần còn lại im lặng.
      4. Giới hạn thời gian render cụ thể là bao nhiêu (trên máy này, i7-8700)?
         - Video 30s ≤ 60s (Recommended): Render không chậm hơn thời gian thực quá 2 lần. Khả thi với FFmpeg; có thể phải đánh đổi bớt độ mượt Ken Burns nếu chậm.
         - Video 30s ≤ 2 phút: Thoải mái hơn, ưu tiên chất lượng chuyển động mượt (không rung).
         - Video 30s ≤ 30s: Nhanh như thời gian thực; khó hơn, có thể phải giảm chất lượng chuyển động.
    user_answer: |
      1. 1 trường, xuống dòng bằng \n (Recommended)
      2. Đúng bằng tổng seconds (Recommended)
      3. Track im lặng + lặp nhạc (Recommended)
      4. Video 30s ≤ 60s (Recommended)
