  - asked_at: "2026-10-28"
    topic_keys: ["feature_description", "constraints", "data_requirements", "error_scenarios", "deploy_approach"]
    agent_questions: |
      1. Phạm vi của spec đầu tiên này nên đến đâu?
         - Lõi render + CLI (Recommended): Module Python nhận JSON kịch bản + ảnh + nhạc → xuất MP4 9:16, chạy bằng 1 lệnh CLI. Chưa có Redis/DB/TTS/ảnh stock — các phần đó là spec sau, gắn lõi này vào.
         - Lõi render + TTS: Như trên, thêm giọng đọc tiếng Việt (edge-tts, có thể đổi sang Azure qua config).
         - Worker đầy đủ: Lõi render + hàng đợi Redis + bảng RenderJob trong Postgres + Docker Compose. Lớn hơn nhiều, phải dựng cả scaffold backend.
      2. Định dạng JSON đầu vào theo bên nào?
         - Theo tài liệu (Recommended): Cảnh tiêu đề + danh sách cảnh, mỗi cảnh: text (đánh dấu *đỏ*), seconds, image. Bỏ emoji/disclaimer (disclaimer đang hoãn theo content.md). Sửa lại xuong-khop.json cho khớp.
         - Giữ như file mẫu: hook/scenes(title+benefit)/outro/disclaimer/emoji, đánh dấu **đỏ**. Cập nhật tài liệu cho khớp với file mẫu.
         - Kết hợp: Theo tài liệu, nhưng giữ thêm cảnh kết (outro, kêu gọi lưu/chia sẻ) như file mẫu.
      3. Khi một cảnh chưa có ảnh (chưa làm tìm ảnh stock), render nên làm gì?
         - Báo lỗi, dừng (Recommended): Nói rõ cảnh nào thiếu ảnh. Đơn giản, không ra video kém chất lượng. Spec sau sẽ thêm tìm ảnh stock.
         - Dùng nền tạm: Nền màu trơn (có thể kèm emoji) để vẫn xem trước được bố cục.
      4. Bạn sẽ chạy và kiểm tra render trên máy nào?
         - Docker trên máy này: Cài Docker Desktop trên Windows này; FFmpeg + Python nằm trong image worker, đúng như tài liệu.
         - Máy Linux trong tài liệu: Máy i5-10400F; code ở đây, chạy thử bên đó.
         - Python + FFmpeg trực tiếp: Cài Python và FFmpeg thẳng lên Windows này, chưa cần Docker ở bước này.
    user_answer: |
