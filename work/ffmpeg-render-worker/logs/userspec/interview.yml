         - Bạn tự cung cấp (Recommended): Ảnh tự chụp hoặc bạn tự tải; bạn bỏ vào samples/xuong-khop/ (nên nén còn ~300–500 KB/ảnh). Chắc chắn về bản quyền.
         - Agent tải từ Pexels/Pixabay: Cần API key (hoặc tải tay từng ảnh); ghi nguồn + giấy phép vào samples/xuong-khop/SOURCES.md.
