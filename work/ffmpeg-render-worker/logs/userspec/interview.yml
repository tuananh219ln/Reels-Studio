      2. Theo tài liệu (Recommended)
      3. Báo lỗi, dừng (Recommended)
      4. Python + FFmpeg trực tiếp
  - asked_at: "2026-10-28"
    topic_keys: ["ui_ux_requirements", "feature_description", "technical_decisions"]
    agent_questions: |
      1. Hộp chữ dùng kiểu nào? (ux-guidelines cho phép 2 kiểu)
         - Nền vàng, chữ đen (Recommended): Hộp vàng đặc, chữ đen in hoa đậm, từ khóa *...* màu đỏ. Dễ đọc trên mọi ảnh, giống kênh tham chiếu.
         - Chữ vàng viền đen: Không có hộp; chữ vàng có viền đen đè thẳng lên ảnh. Thoáng hơn nhưng khó đọc trên ảnh sáng/rối.
         - Cấu hình được: Hỗ trợ cả hai, chọn bằng tham số. Nhiều việc hơn, chỉ đáng nếu bạn thật sự muốn đổi qua lại.
      2. Chữ trên các cảnh nội dung (sau cảnh tiêu đề) đặt ở đâu?
         - Phần dưới khung (Recommended): Hộp chữ ở khoảng 1/3 dưới, để món ăn ở giữa khung không bị che. Cảnh tiêu đề vẫn ở giữa như template.
         - Giữa khung: Giống cảnh tiêu đề; nổi bật nhưng che món ăn.
         - Phần trên khung: Hộp chữ ở khoảng 1/3 trên.
      3. Chuyển giữa các cảnh như thế nào?
         - Mờ chồng ngắn (Recommended): Crossfade ~0.3–0.5 giây giữa các cảnh; mềm mại, hợp giọng 'tờ rơi sức khỏe'.
         - Cắt thẳng: Không hiệu ứng; đơn giản nhất, nhịp nhanh.
      4. Nhạc nền xử lý ra sao?
         - Tùy chọn, nhỏ, fade cuối (Recommended): Không truyền nhạc vẫn render (video câm). Có nhạc: cắt vừa độ dài video, âm lượng mặc định ~25%, fade-out 1–2 giây cuối.
         - Bắt buộc có nhạc: Thiếu nhạc thì báo lỗi, giống thiếu ảnh.
    user_answer: |
      1. Nền vàng, chữ đen (Recommended)
      2. Phần dưới khung (Recommended)
      3. Mờ chồng ngắn (Recommended)
      4. Tùy chọn, nhỏ, fade cuối (Recommended)
  - asked_at: "2026-10-28"
    topic_keys: ["feature_description", "constraints", "technical_decisions", "integration_points"]
    agent_questions: |
      1. Thông số video đầu ra?
         - 1080×1920, 30fps, H.264/AAC (Recommended): Chuẩn Reels/TikTok/Shorts, file ~10–30 MB như deployment.md ước tính.
         - 720×1280, 30fps: Render nhanh hơn, file nhỏ hơn, nhưng kém nét khi đăng.
      2. Cảnh tiêu đề (khung đầu = thumbnail) lấy ảnh ra sao?
         - Ảnh riêng, bắt buộc (Recommended): Cảnh tiêu đề có trường image và seconds riêng như mọi cảnh; thiếu ảnh thì lỗi như cảnh khác. Khung hình đầu tiên có sẵn chữ, không fade-in.
         - Mượn ảnh cảnh 1: Không cần ảnh riêng; dùng lại ảnh của cảnh nội dung đầu tiên.
      3. Font Be Vietnam Pro Black (giấy phép OFL, miễn phí) để ở đâu?
         - Đóng gói trong repo (Recommended): Commit file .ttf + license OFL vào repo; render giống hệt trên Windows và Linux/Docker, không cần cài font.
         - Cài trên máy: Mỗi máy tự cài font; CLI nhận đường dẫn font.
      4. Chạy CLI thế nào và xuất file đi đâu?
         - Tham số đơn giản (Recommended): Ví dụ: `python -m reels_render script.json -o out/video.mp4 [--music nhac.mp3]`. Đường dẫn ảnh trong JSON tính tương đối theo thư mục chứa file JSON.
         - Nhạc khai báo trong JSON: Như trên nhưng file nhạc và âm lượng nằm trong JSON thay vì tham số dòng lệnh (gần với mô hình Video.music track trong DB sau này).
    user_answer: |
      1. 1080×1920, 30fps, H.264/AAC (Recommended)
      2. Ảnh riêng, bắt buộc (Recommended)
      3. Đóng gói trong repo (Recommended)
      4. Tham số đơn giản (Recommended)
  - asked_at: "2026-10-28"
    topic_keys: ["edge_cases", "success_criteria", "testing_strategy", "verification_strategy", "data_requirements"]
    agent_questions: |
      1. Ảnh không đúng tỉ lệ 9:16 (ảnh ngang, ảnh vuông từ điện thoại) xử lý thế nào?
         - Cắt giữa cho đầy khung (Recommended): Phóng ảnh cho phủ kín 1080×1920 rồi cắt phần thừa, lấy tâm ảnh. Không có viền đen; ảnh ngang sẽ mất hai bên.
         - Nền mờ + ảnh nguyên: Giữ nguyên cả ảnh ở giữa, phía sau là bản phóng to làm mờ. Không mất nội dung nhưng trông kém 'cận cảnh' hơn.
      2. Chữ quá dài so với hộp (vượt giới hạn ≤10 chữ/cảnh, ≤12 chữ tiêu đề) thì sao?
         - Tự xuống dòng + thu nhỏ (Recommended): Tự ngắt dòng theo độ rộng hộp, thu nhỏ cỡ chữ đến một mức tối thiểu; vẫn quá dài thì báo lỗi nêu rõ cảnh. Tiêu đề có thể ngắt dòng thủ công bằng xuống dòng trong JSON.
         - Báo lỗi ngay khi vượt số chữ: Cứng theo giới hạn số chữ của content.md.
      3. Tiêu chí 'xong' với bạn là gì? (chọn nhiều)
         - Smoke test tự động: pytest render 1 video ngắn từ ảnh sinh tự động, kiểm tra file tồn tại, đúng 1080×1920, 30fps, đúng thời lượng, có/không có audio (theo patterns.md).
         - Unit test phần logic: Đọc/kiểm tra JSON, tách *đỏ*, tính mốc thời gian crossfade, ngắt dòng chữ.
         - Tôi xem video thật: Bạn render xuong-khop với ảnh món ăn thật và tự xem so với template (agent không tự đánh giá hình ảnh được).
         - Giới hạn thời gian render: Ví dụ video 30 giây render dưới ~1 phút trên máy này.
      4. Ảnh thật để bạn xem thử video xuong-khop lấy từ đâu?
         - Tôi tự chuẩn bị (Recommended): Bạn bỏ 6 ảnh (tiêu đề + 5 món) vào samples/, không commit ảnh nếu không muốn; repo chỉ có JSON.
         - Commit ảnh mẫu vào repo: Ảnh tự chụp hoặc ảnh miễn phí bản quyền, để ai clone về cũng render thử được ngay.
