         - Luôn zoom vào chậm (Recommended): Mọi cảnh phóng to từ 100% → ~112% quanh tâm ảnh, như prototype. Đơn giản, đều, hợp giọng tờ rơi.
         - Xen kẽ zoom vào / ra: Cảnh chẵn zoom vào, cảnh lẻ zoom ra — đỡ đơn điệu hơn chút.
