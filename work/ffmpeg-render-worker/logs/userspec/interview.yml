  - asked_at: "2026-10-28"
    topic_keys: ["technical_decisions", "edge_cases", "error_scenarios", "acceptance_criteria"]
    agent_questions: |
      (Ghi chú: câu trả lời trước về thời lượng chứa mâu thuẫn — tổng = tổng seconds và mỗi cảnh hiện rõ đủ seconds không thể cùng đúng khi có crossfade.)
      1. Crossfade (0.4s) lấy thời gian từ đâu? Giữ tổng = tổng seconds thì phần chồng phải nằm trong seconds của các cảnh.
         - Chia đều quanh mốc chuyển (Recommended): Crossfade nằm giữa ranh giới hai cảnh (0.2s mỗi bên). Tổng video = đúng tổng seconds; cảnh 4s hiện rõ ~3.6s, cảnh đầu/cuối ~3.8s. Khung đầu tiên vẫn là cảnh tiêu đề rõ nét.
         - Mỗi cảnh hiện rõ đủ seconds: Phần chồng cộng thêm ngoài seconds; video dài hơn tổng seconds (số cảnh − 1) × 0.4s, vd 6 cảnh × 4s → 26s.
      2. Giới hạn seconds của mỗi cảnh?
         - ≥ 1 giây, làm tròn theo khung hình (Recommended): seconds < 1 → lỗi nêu cảnh (luôn dài hơn crossfade). Giá trị lẻ như 3.33 làm tròn về khung hình gần nhất (1/30s). Fade-out nhạc cố định 1.5s; video tối thiểu 2 cảnh × 1s nên luôn đủ chỗ.
         - Theo template: 3–5 giây: Cảnh nội dung phải 3–5s (ux-guidelines), ngoài khoảng thì lỗi. Chặt hơn, smoke test sẽ chậm hơn (cảnh tối thiểu 3s).
      3. Chữ rỗng: text trống/chỉ khoảng trắng, dòng trống do \n\n, hoặc ** rỗng?
         - Tất cả báo lỗi nêu cảnh (Recommended): Mọi cảnh phải có chữ; dòng trống và ** rỗng là lỗi nhập liệu. Nhất quán với cách xử lý dấu * lẻ.
         - Cho phép cảnh không chữ: Text rỗng → cảnh chỉ có ảnh, không hộp vàng; dòng trống bị bỏ qua; ** rỗng vẫn là lỗi.
    user_answer: |
      1. Chia đều quanh mốc chuyển (Recommended)
      2. ≥ 1 giây, làm tròn theo khung hình (Recommended)
      3. Tất cả báo lỗi nêu cảnh (Recommended)
