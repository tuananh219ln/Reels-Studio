      `image` trỏ file không tồn tại -> in cảnh báo và tìm ảnh thay; ảnh người dùng luôn ưu tiên.
      Ảnh nhập qua prompt được giữ (ghi vào JSON), ảnh tự động đổi mỗi lần render.
      Cảnh tiêu đề cũng có `keywords`; cảnh không có `keywords` và không có ảnh -> coi như không tìm được (CLI hỏi / lỗi có kiểu).
    gaps: []
    required: true
  error_scenarios:
    score: 90
    value: |
      Không có key nào hoặc không có mạng: dừng ngay với lỗi có kiểu, thông báo rõ, không hỏi từng cảnh.
            Lỗi tạm (429, timeout, HTTP 5xx) ở một cảnh: đợi vài giây thử lại 1 lần; vẫn lỗi thì dừng render với lỗi có kiểu ("Pixabay đang giới hạn lượt tìm, thử lại sau 1 phút"), không hỏi người dùng (người dùng tự bổ sung ảnh vào JSON nếu muốn). Key sai/bị thu hồi (HTTP 4xx xác thực): dừng ngay, "Key ... không hợp lệ, kiểm tra file .env".
      Các quy tắc lỗi tạm / key sai ở trên áp dụng cho Pixabay (nguồn chính). Pexels (tùy chọn) lỗi bất kỳ (429, 5xx, timeout, key sai): tắt Pexels cho cả lần render, tìm bằng Pixabay, cảnh báo 1 lần, không dừng render.
      Ứng viên ảnh không dùng được (hỏng, quá 15 MB, không phải ảnh): bỏ, thử ảnh khác; hết ảnh của từ khóa thì coi như từ khóa không có kết quả -> sang từ khóa/nguồn tiếp; hết mọi từ khóa -> hỏi người dùng (CLI) / lỗi có kiểu (không terminal).
      Tải ảnh lỗi mạng (403, timeout, mất kết nối): thử ảnh khác; nếu mọi thất bại của cảnh đều là lỗi mạng -> dừng với lỗi có kiểu, không hỏi.
      Pixabay từ chối một từ khóa (4xx khác 429, không phải lỗi key): bỏ qua từ khóa, in cảnh báo. "Key không hợp lệ" chỉ khi phản hồi Pixabay nói rõ lỗi key.
      Pexels lỗi lần đầu: tắt Pexels cho cả lần render, cảnh báo 1 lần. Nếu Pexels là nguồn duy nhất (không có key Pixabay) thì Pexels lỗi = dừng với lỗi có kiểu, không hỏi.
      Kiểm tra key/mạng chỉ khi có ít nhất một cảnh thiếu ảnh và có `keywords`; cảnh thiếu ảnh không có `keywords` được hỏi người dùng (không cần key/mạng) khi kịch bản không có cảnh nào cần tìm. Thứ tự luôn là: tìm ảnh cho mọi cảnh cần tìm trước (Q21), rồi mới hỏi; vì vậy kịch bản trộn mà thiếu key/mất mạng thì dừng ở bước tìm, trước mọi lời hỏi, JSON không bị sửa (suy ra từ Q20 + Q21); kịch bản đủ ảnh render được không cần key, không cần mạng.
      Chỉ khi tìm bình thường mà không có kết quả dùng được: CLI hỏi người dùng (không terminal: lỗi có kiểu liệt kê các cảnh).
      Prompt: đường dẫn sai/không phải ảnh/để trống -> báo lỗi, hỏi lại cảnh đó; Ctrl+C/EOF -> dừng, không render, ảnh đã nhập trước đó vẫn giữ trong JSON.
