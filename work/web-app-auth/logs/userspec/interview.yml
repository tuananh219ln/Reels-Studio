  - asked_at: "2026-10-29 00:18:00"
    topic_keys: ["technical_decisions", "user_stories", "data_requirements", "ui_ux_requirements", "constraints"]
    agent_questions: |
      Agent noted: the screenshot has roles (Quản trị viên / Thành viên) but project.md says MVP has no roles or permissions.
      1. Ảnh có vai trò Quản trị viên / Thành viên, nhưng tài liệu dự án ghi MVP không có phân quyền. Chốt thế nào?
         - Có 2 vai trò, chỉ khác ở quản lý người dùng (Recommended): Quản trị viên thấy màn Quản lý người dùng và làm mọi thao tác; Thành viên không thấy màn này, còn lại dùng app như nhau. Tài khoản tạo bằng CLI là Quản trị viên; luôn phải còn ít nhất 1 Quản trị viên hoạt động. Cập nhật project.md cho khớp.
         - Không phân quyền: Bỏ cột Vai trò; ai cũng quản lý người dùng được, đúng như tài liệu hiện tại.
      2. Vô hiệu hoá thay cho Gỡ — có kích hoạt lại được không?
         - Có, không xóa hẳn (Recommended): Vô hiệu hoá: không đăng nhập được, mọi phiên bị đăng xuất ngay; nút đổi thành 'Kích hoạt lại'. Không xóa tài khoản, để sau này video vẫn biết ai tạo. Không tự vô hiệu hoá hay tự đổi vai trò của mình.
         - Có cả Vô hiệu hoá và Xóa: Thêm nút Xóa hẳn tài khoản.
      3. Với Google + mật khẩu dự phòng: 'Thêm người dùng' nhập gì, và mật khẩu hoạt động ra sao?
         - Email + vai trò + mật khẩu tạm (Recommended): Quản trị viên nhập email, chọn vai trò và gõ mật khẩu tạm (tối thiểu 8 ký tự). Người đó vào bằng Google (nếu là Gmail) hoặc bằng mật khẩu tạm rồi bắt buộc đổi. Tên và ảnh lấy từ Google khi họ đăng nhập Google; chưa có thì hiện chữ cái đầu. Có thêm thao tác 'Đặt mật khẩu tạm'.
         - Email + vai trò, mật khẩu tùy chọn: Mật khẩu tạm không bắt buộc; người không có mật khẩu chỉ vào bằng Google.
         - Email + tên + vai trò + mật khẩu: Nhập cả tên khi thêm; tên Google không ghi đè.
      4. 'Phiên hoạt động' và 'Đăng xuất khỏi mọi thiết bị' — bạn có cần thấy danh sách từng thiết bị không?
         - Chỉ số phiên + nút (Recommended): Đúng như ảnh: cột số phiên còn hạn, nút đăng xuất hết. Không liệt kê từng thiết bị/trình duyệt.
         - Có danh sách thiết bị: Bấm vào số phiên xem từng thiết bị, thời gian, đăng xuất từng cái.
    user_answer: |
      1. Không phân quyền
      2. Có, không xóa hẳn (Recommended)
      3. Email + vai trò + mật khẩu tạm (Recommended)
      4. Chỉ số phiên + nút (Recommended)
      Agent's resolution of the 1 vs 3 conflict (told to the user, open to correction): no roles at all, so "Thêm người dùng"
      takes email + temp password only; everyone sees the user-management screen; no Vai trò column.
  - asked_at: "2026-10-29 00:22:00"
    topic_keys: ["technical_decisions", "error_scenarios", "risks", "testing_strategy", "verification_strategy"]
    agent_questions: |
      1. Giao diện trong ảnh của bạn là kiểu Ant Design. Dùng thư viện giao diện nào?
         - Ant Design (Recommended): Dùng thư viện antd: bảng, nút, select, hộp thoại, menu giống hệt ảnh MKT-Tools, chỉnh màu teal #0F3B4C. Ít code tự viết nhất, sẵn tiếng Việt.
         - Tự làm bằng Tailwind: Tự viết component theo bản thiết kế. Nhẹ hơn nhưng nhiều code hơn.
      2. Đăng nhập sai mật khẩu nhiều lần thì sao?
         - Khóa tạm 15 phút sau 5 lần (Recommended): Sai 5 lần liên tiếp cho một email thì email đó không đăng nhập bằng mật khẩu được trong 15 phút (Google vẫn được). Thông báo chung 'Email hoặc mật khẩu không đúng', không lộ email nào có trong hệ thống.
         - Không giới hạn: Đơn giản hơn; chỉ chạy local nên rủi ro thấp, thêm giới hạn khi lên VPS.
      3. Kiểm thử tới đâu?
         - API test trên Postgres thật + E2E đăng nhập (Recommended): pytest cho api chạy trên Postgres (Docker), giả lập Google; Playwright chạy trình duyệt thật cho đăng nhập mật khẩu, bắt buộc đổi mật khẩu, quản lý người dùng, đăng xuất, và cỡ màn điện thoại. Đăng nhập Google thật do bạn thử tay.
         - Chỉ API test: Bỏ E2E trình duyệt; giao diện bạn tự bấm thử.
    user_answer: |
      1. Ant Design (Recommended)
      2. Không giới hạn
      3. API test trên Postgres thật + E2E đăng nhập (Recommended)
      Agent noted: no login rate limit is an accepted limitation while local-only (add on VPS); the login error message stays
      generic ("Email hoặc mật khẩu không đúng").
  - asked_at: "2026-10-29 00:35:00"
    topic_keys: ["success_criteria", "constraints", "technical_decisions", "user_stories", "edge_cases", "error_scenarios"]
    agent_questions: |
      (After the interview-completeness-checker; agent also told the user it decided locally: separate test database
      reels_test; drop SESSION_SECRET because sessions are opaque DB tokens; hide the Google button when Google is not configured.)
      1. Bạn chọn mật khẩu dự phòng để dùng được trên LAN/điện thoại. Đăng nhập bằng mật khẩu qua LAN có nằm trong phần này không?
         - Có, mật khẩu chạy trên LAN (Recommended): App mở được từ máy khác/điện thoại cùng mạng qua http://<IP máy dev>:3000, đăng nhập bằng mật khẩu. Nút Google chỉ hiện khi mở bằng localhost. Phải mở cổng 3000 trên tường lửa Windows; mật khẩu đi qua http không mã hóa trong mạng nội bộ.
         - Không, chỉ localhost: Mọi thứ chỉ dùng trên máy dev; LAN/điện thoại đợi VPS.
      2. Cách làm đăng nhập Google (kỹ thuật) — đồng ý phương án này?
         - Đồng ý (Recommended): api nhận callback tại http://localhost:3000/api/auth/google/callback (qua Next.js, nên cookie cùng trang). Có state + PKCE chống giả mạo. Khớp người dùng theo email Google đã xác minh; lần đầu ghi lại mã tài khoản Google, các lần sau phải trùng mã đó. Google lỗi/chậm quá 15 giây → về trang đăng nhập kèm thông báo. Bạn thêm đúng URI trên vào Google Cloud.
         - Chỉ khớp theo email: Như trên nhưng không ghi mã tài khoản Google; chỉ so email mỗi lần.
      3. Nếu cả đội bị khóa ngoài (quên mật khẩu, hoặc vô hiệu hoá lẫn nhau), gỡ bằng gì? Lệnh CLI gặp email đã có thì sao?
         - CLI đặt lại + kích hoạt (Recommended): Lệnh CLI với email đã có: đặt mật khẩu mới, kích hoạt lại, đăng xuất các phiên cũ (hỏi xác nhận trước). Mật khẩu nhập ẩn 2 lần trong terminal, không truyền qua tham số; không có terminal thì báo lỗi. Người tạo bằng CLI không bị bắt đổi mật khẩu. App chặn vô hiệu hoá người hoạt động cuối cùng.
         - CLI chỉ tạo mới: Email đã có thì báo lỗi; khôi phục phải sửa database tay.
      4. Đổi mật khẩu và thông báo tài khoản bị vô hiệu hoá — đồng ý quy tắc này?
         - Đồng ý (Recommended): Màn bắt buộc đổi (sau mật khẩu tạm) không hỏi mật khẩu cũ; đổi từ menu thì hỏi. Người chỉ dùng Google muốn có mật khẩu riêng: nhờ đồng đội 'Đặt mật khẩu tạm'. Đổi xong thì các phiên khác bị đăng xuất, phiên hiện tại giữ. Đăng nhập Google không bị bắt đổi mật khẩu. 'Tài khoản đã bị vô hiệu hoá' chỉ hiện khi mật khẩu đúng hoặc qua Google, sai mật khẩu thì vẫn thông báo chung.
         - Màn đổi từ menu không hỏi MK cũ: Để người dùng Google tự đặt mật khẩu được; kém an toàn hơn khi quên đăng xuất trên máy chung. Các quy tắc khác như bên cạnh.
    user_answer: |
      1. Không, chỉ localhost
      2. "Tạm thời mail và pass đã" (free text)
      3. CLI đặt lại + kích hoạt (Recommended)
      4. Đồng ý (Recommended)
      Agent's reading (told to the user): drop Google login from this spec entirely; email + password only; Google goes to a
      later spec (backlog). App runs on localhost only.
  - asked_at: "2026-10-29 00:40:00"
    topic_keys: ["user_stories", "data_requirements", "ui_ux_requirements"]
    agent_questions: |
      Không có Google thì tên và ảnh đại diện lấy từ đâu?
      - Nhập tên khi thêm, ảnh là chữ cái đầu (Recommended): 'Thêm người dùng' = email + tên + mật khẩu tạm. Mỗi người tự sửa tên của mình trong menu tài khoản. Ảnh đại diện là vòng tròn chữ cái đầu của tên, không tải ảnh lên.
      - Bỏ cột Tên và Ảnh: Bảng chỉ có email; header hiện email.
      - Có tên và cho tải ảnh đại diện: Thêm chức năng tải ảnh lên; nhiều việc hơn (lưu file, kiểm tra ảnh).
    user_answer: |
      Nhập tên khi thêm, ảnh là chữ cái đầu (Recommended)

  - asked_at: "2026-10-29 00:55:00"
    topic_keys: ["user_stories", "edge_cases", "testing_strategy", "ui_ux_requirements", "technical_decisions"]
    agent_questions: |
      (After the second completeness check; agent told the user it decided locally: E2E runs on its own database reels_e2e with
      its own api/web on ports 8100/3100; while a must-change-password flag is on, the API itself only allows changing the
      password and logging out; email must be a valid format and name 1–60 characters, same rules in the app and the CLI.)
      1. Người đang bị vô hiệu hoá thì dòng của họ có những thao tác nào?
         - Chỉ 'Kích hoạt lại' (Recommended): Ẩn 'Đặt mật khẩu tạm' và 'Đăng xuất khỏi mọi thiết bị' (đã bị đăng xuất rồi). Muốn cho họ vào lại: Kích hoạt lại (có xác nhận), rồi đặt mật khẩu tạm nếu cần.
         - Đặt MK tạm cũng kích hoạt: Giống CLI: đặt mật khẩu tạm cho người bị vô hiệu hoá thì kích hoạt luôn.
      2. Khôi phục bằng CLI với email đã có: xử lý tên và cờ bắt đổi mật khẩu thế nào?
         - Giữ tên, bỏ cờ bắt đổi (Recommended): Email đã có thì CLI không hỏi tên, giữ tên cũ. Mật khẩu nhập ở CLI là mật khẩu thật nên không bắt đổi. Trả lời 'không' ở bước xác nhận thì không đổi gì và thoát mã khác 0.
         - Hỏi lại tên: Cho nhập tên mới (Enter để giữ). Các điểm khác như bên cạnh.
      3. Ảnh đại diện chữ cái — tên người Việt họ đứng trước (Nguyễn Văn An). Lấy chữ nào?
         - Chữ đầu của từ cuối (Recommended): 'Nguyễn Văn An' → A. Phân biệt người tốt hơn vì nhiều người cùng họ Nguyễn.
         - Hai chữ: họ + tên: 'Nguyễn Văn An' → NA.
         - Chữ đầu của từ đầu: 'Nguyễn Văn An' → N.
    user_answer: |
      1. Chỉ 'Kích hoạt lại' (Recommended)
      2. Giữ tên, bỏ cờ bắt đổi (Recommended)
      3. Chữ đầu của từ cuối (Recommended)


