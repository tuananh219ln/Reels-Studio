  - asked_at: "2026-10-28 23:50:00"
    topic_keys: ["constraints", "deploy_approach", "ui_ux_requirements", "user_stories", "technical_decisions", "target_users"]
    agent_questions: |
      1. Máy dev chưa có Docker. Chạy Postgres + api + web thế nào ở giai đoạn này?
         - Postgres trong Docker (Recommended): Cài Docker Desktop; Postgres chạy bằng docker compose, còn api (Python) và web (Node) chạy trực tiếp trên máy để sửa code thấy ngay. File compose đầy đủ (cả api, web) vẫn có sẵn cho VPS sau này.
         - Tất cả trong Docker Compose
         - Không dùng Docker
      2. Các mục menu chưa làm ở phần này (Kho kiến thức, Thư viện nhạc, Job logs) hiển thị thế nào?
         - Hiện, trang "Sắp có" (Recommended) / Ẩn cho tới khi làm
      3. Thành viên mới nhận mật khẩu tạm. Sau lần đăng nhập đầu thì sao?
         - Bắt buộc đổi (Recommended): đăng nhập bằng mật khẩu tạm thì phải đặt mật khẩu mới trước khi vào app; màn "Đổi mật khẩu" dùng được cả lúc sau từ menu tài khoản.
         - Không bắt buộc, có màn đổi / Không có đổi mật khẩu
      4. Đăng nhập giữ bao lâu, và đội có khoảng bao nhiêu người?
         - 30 ngày, 2–5 người (Recommended): cookie phiên httpOnly, gia hạn khi dùng; đội nhỏ nên không cần phân trang hay phân quyền.
         - 7 ngày / Hết khi đóng trình duyệt
    user_answer: |
      1. Postgres trong Docker (Recommended)
      2. Hiện, trang "Sắp có" (Recommended)
      3. Bắt buộc đổi (Recommended)
      4. 30 ngày, 2–5 người (Recommended)
  - asked_at: "2026-10-29 00:05:00"
    topic_keys: ["user_stories", "edge_cases", "feature_description", "success_criteria", "ui_ux_requirements", "technical_constraints"]
    agent_questions: |
      1. Mật khẩu tạm (khi thêm thành viên hoặc đặt lại) được tạo và giao thế nào?
         - Tự sinh, hiện 1 lần (Recommended): App sinh mật khẩu ngẫu nhiên, hiện đúng một lần trong hộp thoại kèm nút Sao chép để bạn gửi qua Zalo/chat. Đóng hộp là không xem lại được (chỉ lưu bản hash). Không gửi email.
         - Người tạo tự gõ: Người thêm thành viên tự nhập mật khẩu tạm.
         - Gửi email: Gửi mật khẩu tạm qua email. Cần cấu hình dịch vụ gửi mail (SMTP), thêm việc và chi phí.
      2. Quy tắc gỡ thành viên và đặt lại mật khẩu?
         - Không tự gỡ mình (Recommended): Không gỡ được chính mình, nên luôn còn ít nhất 1 người. Gỡ ai thì người đó bị đăng xuất ngay. Đặt lại mật khẩu của ai cũng đăng xuất họ khỏi mọi máy. Có hộp xác nhận trước khi gỡ.
         - Gỡ được cả mình: Chỉ chặn gỡ người cuối cùng.
      3. Màn Danh sách video trong phần này có gì?
         - Chỉ trạng thái trống (Recommended): Tiêu đề Video + khung 'Chưa có video nào'. Nút 'Tạo video mới' để spec sau (cần bảng Video và Claude).
         - Có nút Tạo video (chưa chạy): Hiện nút nhưng bấm ra thông báo 'Sắp có'.
      4. Làm xong phần này, bạn muốn làm được gì ngay để coi là thành công? (chọn nhiều)
         - Một lệnh chạy cả app local: Có hướng dẫn/lệnh rõ ràng để bật Postgres, api, web và mở localhost.
         - Tạo tài khoản đầu bằng CLI: Một lệnh tạo tài khoản đầu tiên, rồi đăng nhập được.
         - Đội đăng nhập trên mạng LAN: Người khác trong cùng mạng mở được app trên máy dev. Thêm cấu hình mạng/cookie.
         - Dùng được trên điện thoại: Giao diện co giãn tốt ở màn hình điện thoại (menu xếp gọn).
    user_answer: |
      1. Người tạo tự gõ
      2. Không tự gỡ mình (Recommended)
      3. Chỉ trạng thái trống (Recommended)
      4. Một lệnh chạy cả app local, Tạo tài khoản đầu bằng CLI, Dùng được trên điện thoại, Đội đăng nhập trên mạng LAN
  - asked_at: "2026-10-29 00:10:00"
    topic_keys: ["technical_decisions", "constraints", "success_criteria", "user_stories", "risks"]
    agent_questions: |
      (User, mid-turn, unprompted: "Có thể làm đanwg nhập bằng gmail là được")
      Agent explained: Google login removes passwords (temp password / forced change / reset), Members becomes an allow-list of
      Gmail addresses, needs a Google Cloud OAuth Client (Client ID/Secret in .env), and Google does not accept private-IP redirect
      URIs (e.g. http://192.168.1.10:3000) — only localhost or a real HTTPS domain — so LAN/phone login would have to wait.
      1. Chốt cách đăng nhập nào?
         - Chỉ Google + danh sách Gmail được phép: Không có mật khẩu. Gmail đầu tiên thêm bằng lệnh CLI; sau đó thành viên thêm/gỡ Gmail trong màn Thành viên. Gọn nhất, ít việc nhất, nhưng LAN/điện thoại phải chờ HTTPS.
         - Google + mật khẩu dự phòng: Có cả hai: Google cho tiện, email/mật khẩu để đăng nhập trên LAN/điện thoại ngay. Nhiều việc và nhiều chỗ dễ sai nhất.
         - Giữ mật khẩu, Google để sau: Làm đúng như đã chốt (mật khẩu tạm, bắt buộc đổi), LAN/điện thoại dùng được ngay. Thêm Google khi lên VPS có tên miền.
      2. Nếu chọn Google: xử lý yêu cầu dùng trên LAN/điện thoại thế nào?
         - Chỉ localhost lúc này (Recommended): Giai đoạn này chỉ đăng nhập trên máy dev. Giao diện vẫn làm co giãn cho điện thoại (thử bằng chế độ thiết bị của trình duyệt). Đội dùng thật khi có VPS + tên miền.
         - Dựng HTTPS tạm cho máy dev: đường hầm có tên miền HTTPS (ví dụ Cloudflare Tunnel). Thêm cài đặt, và app ra Internet công khai.
         - Không áp dụng: Tôi chọn giữ mật khẩu ở câu trên.
    user_answer: |
      1. Google + mật khẩu dự phòng
      2. Chỉ localhost lúc này (Recommended)
