notes: |
  Batch 1: chia spec đã đồng ý (spec này = soạn kịch bản + render server + tải MP4 + danh sách video/job;
  sau: Claude + Knowledge Base; sau nữa: TTS, thư viện nhạc). Nhưng câu 1 chọn "Claude viết theo mẫu đó" —
  mâu thuẫn với cách chia, cần hỏi lại. Ảnh: upload + Pixabay tự động + xem trước & chọn Pixabay.
  Nhạc: muốn nhạc TikTok theo chủ đề (Windy Hill) — cần làm rõ bản quyền/nguồn file.
  Tài liệu tham khảo: PDF plan của chủ dự án (trùng nguồn content.md).
