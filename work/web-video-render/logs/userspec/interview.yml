conversation_history:
  - asked_at: "2026-10-29 19:30:00"
    topic_keys: ["feature_description", "work_type", "constraints", "data_requirements", "dependencies"]
    agent_questions: |
      1. "Dựa trên kịch bản đã làm trên local" nghĩa là gì? Trên máy, bạn tự viết file JSON (như samples/xuong-khop.json: tiêu đề + các cảnh, mỗi cảnh có chữ, số giây, ảnh, từ khóa) rồi chạy lệnh render.
         Lựa chọn: Web nhập kịch bản như JSON (Recommended) / Claude viết theo mẫu đó / Upload file JSON có sẵn
      2. Để spec vừa sức, mình đề xuất chia: (1) spec này = soạn kịch bản trên web + render trên server + tải MP4 + danh sách video/job; (2) spec sau = Claude viết kịch bản + Knowledge Base; (3) TTS, thư viện nhạc để sau nữa. Bạn đồng ý không?
      3. Ảnh cho từng cảnh trên web lấy thế nào? (chọn nhiều) Upload ảnh của mình / Tự tìm Pixabay khi trống / Xem trước & chọn ảnh Pixabay
      4. Nhạc nền khi render trên server? Upload file nhạc theo từng video / Chưa cần nhạc / Thư viện nhạc chung của team
    user_answer: |
      1. Claude viết theo mẫu đó
      2. Đồng ý chia như vậy (Recommended)
      3. Upload ảnh của mình, Tự tìm Pixabay khi trống, Xem trước & chọn ảnh Pixabay
      4. Chủ yếu nhạc tiktok theo chủ đề, ví dụ dinh dưỡng sức khỏe, đồng quê có thể windy hill
      (Kèm theo: người dùng gửi PDF "Plan Project Knowledge – Kênh Reels Dưỡng sinh & Dinh dưỡng" làm tài liệu tham khảo video — cùng nguồn với content.md.)
  - asked_at: "2026-10-29 19:40:00"
    topic_keys: ["feature_description", "user_stories", "ui_ux_requirements", "constraints", "risks"]
    agent_questions: |
      1. Bạn chọn "Claude viết kịch bản theo mẫu" nhưng cũng đồng ý để Claude sang spec sau. Vậy spec này có gồm phần Claude viết kịch bản không?
         Lựa chọn: Có, Claude bản gọn (Recommended) — nhập chủ đề → Claude trả đủ 6 phần theo prompt trong PDF, prompt là ô văn bản sửa được, Knowledge Base đầy đủ để spec sau / Không, tự nhập trước / Có, kèm Knowledge Base đầy đủ
      2. Nhạc TikTok (kể cả "Windy Hill") có bản quyền: app không tải được từ thư viện TikTok, và gắn sẵn vào MP4 rồi đăng dễ bị tắt tiếng / mất kiếm tiền. Cách thường làm: xuất video không nhạc rồi chọn nhạc ngay trong app TikTok/Facebook khi đăng. Bạn muốn thế nào?
         Lựa chọn: Xuất không nhạc + gợi ý nhạc (Recommended) / Có tùy chọn upload mp3 / Cả hai
      3. Sau khi có kịch bản, bạn cần sửa những gì trước khi render? (chọn nhiều) Sửa chữ, số giây, từ khóa / Thêm / xóa / đổi thứ tự cảnh / Xem trước khung hình / Chọn 1 trong 5 tiêu đề
      4. Khi render xong, bạn cần gì ở trang video? (chọn nhiều) Tải MP4 + xem ngay trên web / Copy caption + hashtag / Render lại / Nhân bản video
    user_answer: |
      1. Có, Claude bản gọn (Recommended)
      2. Cả hai
      3. Sửa chữ, số giây, từ khóa, Thêm / xóa / đổi thứ tự cảnh, Xem trước khung hình, Chọn 1 trong 5 tiêu đề
      4. Tải MP4 + xem ngay trên web, Nhân bản video, Copy caption + hashtag
  - asked_at: "2026-10-29 19:50:00"
    topic_keys: ["success_criteria", "user_stories", "ui_ux_requirements", "target_users"]
    agent_questions: |
      1. Khi nào bạn coi tính năng này là "xong"? Chọn mục tiêu đo được. (chọn nhiều) Từ chủ đề → MP4 dưới 10 phút / Video giống hệt bản render trên máy / Render ≤ 2× độ dài video / Cả team 5 người dùng chung
      2. "Nhân bản video" cụ thể là gì? Sao chép nguyên để sửa tay (Recommended) / Claude viết lại biến thể
      3. Sửa video đã render xong thì sao? (Bạn không chọn "Render lại" ở câu trước.) Sửa rồi render lại, giữ bản mới nhất (Recommended) / Giữ tất cả các bản MP4 / Không sửa, phải nhân bản
      4. Trang danh sách video cần gì? (chọn nhiều) Trạng thái + người tạo + ngày / Ảnh thu nhỏ / Tìm theo tiêu đề/chủ đề / Xóa video
    user_answer: |
      1. Từ chủ đề → MP4 dưới 10 phút, Video giống hệt bản render trên máy, Render ≤ 2× độ dài video, Cả team 5 người dùng chung
      2. Claude viết lại biến thể
      3. Sửa rồi render lại, giữ bản mới nhất (Recommended)
      4. Trạng thái + người tạo + ngày, Ảnh thu nhỏ, Tìm theo tiêu đề/chủ đề, Xóa video
  - asked_at: "2026-10-29 20:10:00"
    topic_keys: ["technical_decisions", "constraints", "integration_points", "data_requirements", "edge_cases", "risks"]
    agent_questions: |
      1. Ảnh upload, nhạc và MP4 cần một chỗ lưu mà cả api lẫn worker render đều đọc/ghi được. Hiện trên Coolify chưa có gì. Chọn cách nào? Thư mục chung trên VPS (Recommended) / Cloudflare R2
      2. Hàng đợi job (Claude viết, render): tài liệu dự án ghi dùng Redis. Với 1–3 video/ngày, dùng luôn bảng job trong Postgres là đủ và bớt một dịch vụ phải chạy. Chọn? Bảng job trong Postgres (Recommended) / Redis như thiết kế
      3. Ảnh Pixabay tự động hiện được chọn ngẫu nhiên mỗi lần render, nên ảnh xem trước có thể khác ảnh trong MP4. Muốn thế nào? Chốt ảnh khi xem trước (Recommended) / Để ngẫu nhiên khi render
      4. Giới hạn và cảnh báo nào cần có ngay trong spec này? (chọn nhiều) Cảnh báo từ cấm / Giới hạn dung lượng file / Giới hạn số lần gọi Claude / Render 1 video một lúc
    user_answer: |
      1. chọn VPS folder ngay bây giờ, nhưng dặn code viết một lớp storage trung gian (ví dụ storage.save() và storage.get()). Khi cần chuyển sang R2 thì chỉ đổi cấu hình, không phải sửa logic. Trên Coolify, chỉ cần mount cùng một volume, ví dụ /data/storage, vào cả container api và worker.
      2. Bảng job trong Postgres (Recommended)
      3. Chốt ảnh khi xem trước (Recommended)
      4. Cảnh báo từ cấm, Giới hạn dung lượng file, Render 1 video một lúc
  - asked_at: "2026-10-29 20:22:00"
    topic_keys: ["error_scenarios", "edge_cases", "user_stories", "deploy_approach", "manual_user_actions"]
    agent_questions: |
      1. Khi có lỗi thì xử lý thế nào? (Claude lỗi/hết hạn mức, Pixabay không tìm thấy ảnh, render lỗi, worker bị tắt giữa chừng) Báo lỗi tiếng Việt + nút Thử lại (Recommended) — job chuyển "Lỗi" với lý do dễ hiểu, kịch bản/ảnh đã sửa vẫn giữ; job kẹt quá 15 phút tự chuyển Lỗi; cảnh không tìm được ảnh đánh dấu đỏ, bắt upload hoặc đổi từ khóa trước khi render / Tự thử lại vài lần rồi mới báo
      2. Hai người cùng sửa một video, hoặc xóa/sửa khi video đang render thì sao? Khóa khi render, người lưu sau thắng (Recommended) / Báo xung đột khi lưu
      3. Nhân bản bằng Claude: bạn nhập gì? Ô ghi yêu cầu đổi (Recommended) — Claude giữ công thức video gốc, viết kịch bản mới thành 1 video nháp mới (ảnh chưa gán); đề xuất 10 biến thể để sau / Claude đề xuất 10 biến thể
      4. Triển khai: những việc tay bạn sẽ làm trên Coolify. Bạn đã có sẵn gì? (chọn nhiều) ANTHROPIC_API_KEY / PIXABAY_API_KEY / Quyền tạo thêm ứng dụng trên Coolify / Chưa có gì
    user_answer: |
      1. Báo lỗi tiếng Việt + nút Thử lại (Recommended)
      2. Khóa khi render, người lưu sau thắng (Recommended)
      3. Ô ghi yêu cầu đổi (Recommended)
      4. ANTHROPIC_API_KEY, PIXABAY_API_KEY, Sẽ bổ sung thêm
  - asked_at: "2026-10-29 20:35:00"
    topic_keys: ["testing_strategy", "verification_strategy", "data_requirements"]
    agent_questions: |
      1. Cách kiểm thử mình đề xuất: test tự động giả lập Claude và Pixabay (không tốn tiền, không phụ thuộc mạng); worker có test render thật bằng FFmpeg trong CI; E2E web chạy luồng tạo → sửa → render với Claude giả. Sau deploy, bạn tự làm 1 video thật trên reels.quangdang.xyz và bấm giờ (≤ 10 phút), so với xuong-khop.mp4. Đồng ý? Đồng ý (Recommended) / Thêm 1 test gọi Claude thật
      2. Prompt Claude bản gọn: dùng nội dung nào làm mặc định? Theo PDF + mẫu xương khớp (Recommended) — Custom Instructions + "Prompt viết kịch bản" trong PDF, kèm samples/xuong-khop.json làm ví dụ đầu ra; ai trong team cũng sửa được trên web / Tôi sẽ dán prompt riêng
    user_answer: |
      1. Đồng ý (Recommended)
      2. Theo PDF + mẫu xương khớp (Recommended)
