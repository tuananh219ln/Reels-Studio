      4. Gợi ý tên nhạc lấy từ đâu? (Khi upload mp3 thì âm lượng mặc định 25%, như bản trên máy.) Claude gợi ý theo chủ đề (Recommended) — Claude trả thêm 2–3 tên nhạc không lời; hiện ở trang video, sửa được, copy được / Danh sách cố định theo chủ đề / Ô ghi chú tự nhập
    user_answer: |
      1. Như cảnh thường, Claude trả thêm từ khóa (Recommended)
      2. Giữ MP4 cũ tới khi bản mới xong (Recommended)
