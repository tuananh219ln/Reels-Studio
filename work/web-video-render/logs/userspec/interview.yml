      2. Render lại và MP4 cũ: xử lý thế nào? Giữ MP4 cũ tới khi bản mới xong (Recommended) — render lại lỗi thì MP4 cũ vẫn xem/tải được; đã sửa kịch bản mà chưa render lại thì hiện nhãn vàng "MP4 chưa cập nhật theo bản sửa" nhưng vẫn cho tải / Xóa MP4 cũ ngay khi sửa
