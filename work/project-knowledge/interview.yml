  # research note 2026-10-28: MoneyPrinterTurbo (MIT, Python, actively maintained). Components: FastAPI API (app/controllers/v1/video.py: create video/audio/subtitle tasks, list/get/delete tasks, stream/download artifacts) + Streamlit WebUI (webui/Main.py, i18n incl. vi.json), two docker-compose services sharing a local volume. Pipeline in app/services/task.py: generate_script (LLM via openai/litellm/google-genai) -> generate_terms (search keywords) -> generate_audio (edge-tts / Azure Speech, app/services/voice.py) -> generate_subtitle (TTS word timings or faster-whisper) -> get_video_materials (Pexels/Pixabay/local, app/services/material.py) -> generate_final_videos (MoviePy 2.2 + imageio-ffmpeg, app/services/video.py) -> optional cross-post (upload-post). Task state in memory or Redis (app/controllers/manager); artifacts on local disk. No user auth, no relational DB, script is one paragraph not scenes, materials are stock video clips.
  # research note 2026-10-28: Remotion Free License covers teams of up to 3 people; 4+ headcount needs a Company License; automated rendering falls under "Remotion for Automators" (source: remotion.dev/docs/license/faq, remotion.dev/docs/terms via context7).
