    agent_questions: "Free-form project description: what it is, who uses it, problem, key features, product form, MVP."
    user_answer: |
      Là công cụ tạo video ngắn reel, thời gian mỗi video khoảng 20-30s. Đăng cả 3 kênh reels/tiktok/Shorts.
      Lên ý tưởng và kịch bản, tôi có thể cung cấp hình ảnh cho phần kịch bản + bổ sung thêm phần quản lý và đăng bài theo lịch.
      Cho tôi dùng và team nội bộ của tôi.
      Vấn đề: hiện tại tôi có ít thời gian lên ý tưởng và edit video.
      Tính năng chính: dựa trên phân tích 1 kênh tôi biết:
      1. Chọn chủ đề (3 phút): lấy từ lịch chủ đề hoặc "nhân bản" video thắng tuần trước (đổi thực phẩm, đổi mốc tuổi, đổi con số).
      2. Viết kịch bản bằng Claude (5 phút): dùng prompt mẫu trong Project.
      3. Kiểm tra nội dung (3 phút): đối chiếu lợi ích với nguồn; bỏ từ cấm; thêm câu "Tham khảo, không thay thế tư vấn bác sĩ".
      4. Lấy hình (10 phút): ưu tiên tự chụp/quay món thật (nội dung gốc để được kiếm tiền); bổ sung ảnh AI hoặc kho ảnh miễn phí bản quyền.
      5. Dựng CapCut (7 phút): template cố định (hộp chữ vàng, font đậm), nhạc thư viện có bản quyền Facebook/CapCut; giọng đọc AI hoặc tự đọc.
      6. Đăng & ghim (2 phút): caption có danh sách đầy đủ, 3–5 hashtag, bình luận ghim link affiliate; đăng 11h–12h hoặc 19h–21h.
      7. Đo sau 48 giờ: ghi view, share, lưu vào bảng theo dõi; video vượt 10× trung vị thì làm ngay 3 biến thể.
      Dạng sản phẩm: Web App.
      MVP: Đăng nhập tài khoản cho team. Nhập chủ đề hoặc sản phẩm, AI trả về 1 kịch bản 5–7 cảnh, người dùng sửa được.
      Upload ảnh của mình và gán vào từng cảnh. Cảnh nào thiếu ảnh thì tự tìm ảnh theo từ khóa.
      Render bằng 1 template cố định: ảnh có hiệu ứng Ken Burns, chữ overlay, 1 bản nhạc nền, giọng đọc TTS tiếng Việt.
      Trang job logs với trạng thái, thời gian, nút tải MP4 và nút chạy lại.
    summary: "Internal web app automating a 7-step short-video workflow (topic → Claude script → compliance check → images → templated render → scheduled post → 48h metrics). MVP = team login, AI 5–7 scene script editable, own image upload per scene + keyword image search fallback, fixed-template render (Ken Burns, text overlay, BGM, Vietnamese TTS), job log page with status/duration/MP4 download/re-run. Posting and scheduling come after MVP."
