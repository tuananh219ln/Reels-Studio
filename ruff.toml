# One Python lint config for api/ and worker/. Run from the repo root: `ruff check api worker`.
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # long strings (prompts, Vietnamese messages) read better unbroken; 120 is a guide, not a gate
    "B905",   # zip() is used on lists built together; strict= would only add noise
    "SIM105", # try/except/pass is as clear as contextlib.suppress
    "SIM300", # flags ALL_CAPS settings compared with a computed value as a "Yoda" condition
]

[lint.flake8-bugbear]
# FastAPI declares parameters with these calls in default values; that is how the framework works.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Body"]

[lint.isort]
known-first-party = ["reels_api", "reels_render"]

[lint.per-file-ignores]
# pytest fixtures are imported from conftest modules and then named as test parameters.
"**/tests/**" = ["F811"]
# conftest sets environment variables before importing the app, which reads them at import time.
"**/tests/conftest.py" = ["E402"]
