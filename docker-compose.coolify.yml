# Production stack on Coolify (Docker Compose build pack, compose location /docker-compose.coolify.yml).
# The web app is not here: it runs on Cloudflare and forwards /api/* to this api's domain.
# Coolify generates SERVICE_PASSWORD_POSTGRES once and keeps it; set the domain of `api` in the UI.
services:
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://reels:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/reels
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, urllib.error as e\ntry: u.urlopen('http://127.0.0.1:8000/api/me')\nexcept e.HTTPError: pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reels
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: reels
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reels -d reels"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
