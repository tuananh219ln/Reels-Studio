# Local development database only. Dockerfiles for web/api and a full stack come with the VPS deploy spec.
# A fixed project name keeps the same container and volume when the repo folder is moved, renamed or
# checked out as a git worktree (the default name is the folder's).
name: reels-studio
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reels
      POSTGRES_PASSWORD: reels
      POSTGRES_DB: reels
    ports:
      # Cổng host đổi được qua POSTGRES_PORT trong .env (máy có Postgres khác chiếm 5432).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reels -d reels"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
