# Local development database only. Dockerfiles for web/api and a full stack come with the VPS deploy spec.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: reels
      POSTGRES_PASSWORD: reels
      POSTGRES_DB: reels
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reels -d reels"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
